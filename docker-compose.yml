services:
  db:
    image: postgres:16
    env_file:
      - .env
    # Publish PostgreSQL only on loopback so host-network services can reach it
    # without exposing the database on the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000

  worker:
    build: .
    env_file:
      - .env
    environment:
      # Host networking removes Compose DNS, so the worker must reach PostgreSQL
      # through the loopback port published by the db service above.
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
    # The worker must share the host network namespace to see the same L2
    # broadcast domain as the host NIC (10.0.0.0/24 on eno1).
    network_mode: host
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - NET_RAW
    command: python manage.py worker_manager

volumes:
  postgres_data:
