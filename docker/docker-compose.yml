services:
  # PHP-FPM Application Container
  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: netvibe-app
    restart: unless-stopped
    working_dir: /var/www/html
    # Keep the base configuration production-friendly —
    # development mounts and debug flags belong in docker/dev/docker-compose.override.yml
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-modern_ipam}
      - DB_USERNAME=${DB_USERNAME:-ipam_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
    networks:
      - ipam-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Web Server
  webserver:
    image: nginx:1.28.0-alpine
    container_name: netvibe-webserver
    restart: unless-stopped
    # Ports and local volumes are provided in docker/dev/docker-compose.override.yml for dev
    networks:
      - ipam-network
      - proxy
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--server-response", "http://localhost/up", "||", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MariaDB Database (built image to include my.cnf in-image)
  db:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    image: netvibe-db:11.8
    container_name: netvibe-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-modern_ipam}
      MYSQL_USER: ${DB_USERNAME:-ipam_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - ipam-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis Cache & Sessions
  redis:
    image: redis:8.4.0-alpine
    container_name: netvibe-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - ipam-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Dedicated queue worker
  worker:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    image: netvibe-app
    container_name: netvibe-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: ${WORKER_CMD:-php artisan queue:work --tries=3 --timeout=300}
    # Keep worker environment defaulting to production in base
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-modern_ipam}
      - DB_USERNAME=${DB_USERNAME:-ipam_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
    networks:
      - ipam-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep php || true"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ipam-network:
    driver: bridge
  proxy:
    external: true

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
