services:
  # PHP-FPM Application Container
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: modern-ipam-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-modern_ipam}
      - DB_USERNAME=${DB_USERNAME:-ipam_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
    networks:
      - ipam-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Web Server
  webserver:
    image: nginx:1.28.0-alpine
    container_name: modern-ipam-webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ipam-network
      - proxy
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--server-response", "http://localhost/up", "||", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MariaDB Database
  db:
    image: mariadb:11.8
    container_name: modern-ipam-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-modern_ipam}
      MYSQL_USER: ${DB_USERNAME:-ipam_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3306:3306"
    networks:
      - ipam-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis Cache & Sessions
  redis:
    image: redis:8.4.0-alpine
    container_name: modern-ipam-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - ipam-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Node.js for Asset Compilation
  node:
    image: node:22-alpine
    container_name: modern-ipam-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - ipam-network
    command: sh -c "npm install && npm run dev"
    profiles:
      - dev

  # Dedicated queue worker
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: modern-ipam-app
    container_name: modern-ipam-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=300
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-modern_ipam}
      - DB_USERNAME=${DB_USERNAME:-ipam_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
    networks:
      - ipam-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep php || true"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ipam-network:
    driver: bridge
  proxy:
    external: true

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
