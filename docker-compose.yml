services:
  # =============================================================================
  # CORE SERVICES
  # =============================================================================
  
  # PHP Application Container (ServerSideUp FPM-NGINX)
  netvibe-web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: netvibe-app
    container_name: netvibe-web
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env
    environment:
      # ServerSideUp user mapping
      - PUID=${WWWUSER:-1000}
      - PGID=${WWWGROUP:-1000}
      # PHP settings
      - PHP_OPCACHE_ENABLE=1
      - PHP_DATE_TIMEZONE=${TZ:-UTC}
      # Disable auto-migrations (we use setup wizard)
      - AUTORUN_ENABLED=false
      # Laravel settings
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-netvibe-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
    # Persistent storage for Production (Dev overrides with bind mounts)
    volumes:
      - app-storage:/var/www/html/storage
      - app-uploads:/var/www/html/public/uploads
    # ServerSideUp uses port 8080 internally
    ports:
      - "9693:8080"
    networks:
      - ipam-network
      - proxy
    depends_on:
      netvibe-db:
        condition: service_healthy
      netvibe-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MariaDB Database
  netvibe-db:
    image: mariadb:11.8
    container_name: netvibe-db
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=${TZ}
      - MARIADB_ROOT_PASSWORD=${DB_PASSWORD}
      - MARIADB_DATABASE=${DB_DATABASE}
      - MARIADB_USER=${DB_USERNAME}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - ipam-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis Cache & Sessions
  netvibe-redis:
    image: redis:8-alpine
    container_name: netvibe-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    environment:
      - TZ=${TZ}
    volumes:
      - redis-data:/data
    networks:
      - ipam-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Queue Worker
  netvibe-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: netvibe-app
    container_name: netvibe-worker
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env
    environment:
      - PUID=${WWWUSER:-1000}
      - PGID=${WWWGROUP:-1000}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-netvibe-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
    volumes:
      - app-storage:/var/www/html/storage
      - app-uploads:/var/www/html/public/uploads
    # Override S6 to run queue worker instead of NGINX
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=300"]
    networks:
      - ipam-network
    depends_on:
      netvibe-db:
        condition: service_healthy
      netvibe-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep php || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ipam-network:
    # Driver is implicitly bridge for user-defined networks

  proxy:
    external: true

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local
  app-uploads:
    driver: local
