services:
  # Development override — bind-mount source and enable dev settings
  netvibe-web:
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - LOG_OUTPUT_LEVEL=debug
    volumes:
      # Bind mount the entire project to /var/www/html
      - ./:/var/www/html:cached
      # Explicit bind mounts override named volumes for local dev
      - ./storage:/var/www/html/storage:cached
      - ./public/uploads:/var/www/html/public/uploads:cached
    ports:
      - "9693:8080"
    # Ensure web waits for DB to be healthy before starting (no separate init container)
    depends_on:
      netvibe-db:
        condition: service_healthy

  netvibe-worker:
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    volumes:
      - ./:/var/www/html:cached

  # Note: DB initialization is handled by mounting the script into the MariaDB
  # container's `/docker-entrypoint-initdb.d/` directory (see `docker-compose.yml`).
  # The `netvibe-db-init` one-shot helper has been removed to keep a single DB container.